on:
  push:
    branches:
      - master
      - 'rebrand/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
  APPCENTER_TOKEN: ${{ secrets.APPCENTER_TOKEN }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  GITHUB_EVENT_AFTER: ${{ github.event.after }}
  BUILD_DIR: ${{ github.workspace }}
  XCODE_BUILD_PATH: DerivedData/Build/Products/Release
  VERSION_FILE: VERSION.txt
  APP_NAME: TabFlow

jobs:
  test:
    name: Test Stage (Lint, Unit Tests & Mutation Tests)
    runs-on: macos-15
    steps:
      - id: pre-checkout
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            COUNT=0
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            COUNT=$(( $(echo "$COMMITS" | jq length 2>/dev/null || echo 0) + 30 ))
          else
            COUNT=0
          fi
          echo "fetch-depth=$COUNT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ steps.pre-checkout.outputs.fetch-depth }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
      - run: npm ci
      - name: Run Commit Lint
        run: |
          if [ -n "$GITHUB_EVENT_BEFORE" ] && git merge-base "$GITHUB_EVENT_BEFORE" "$GITHUB_EVENT_AFTER" >/dev/null 2>&1; then
            npx commitlint --from "$GITHUB_EVENT_BEFORE" --to "$GITHUB_EVENT_AFTER" --verbose || npx commitlint --last --verbose
          elif [[ "${{ github.ref }}" != refs/tags/* ]]; then
            npx commitlint --last --verbose
          fi
      - name: Ensure Generated Files Are Up To Date
        run: scripts/ensure_generated_files_are_up_to_date.sh
      - name: Run Unit Tests with Coverage
        run: scripts/run_tests.sh
      - name: Run Mutation Tests
        run: scripts/run_mutation_tests.sh

  build:
    name: Build Stage (Compile & Package App)
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
      - run: scripts/print_env.sh
      - run: scripts/determine_next_version.sh
      - run: scripts/replace_environment_variables_in_app.sh
      - name: Setup Code Signing Keychains
        run: scripts/codesign/setup_ci_master.sh
        if: github.event_name == 'push'
      - name: Build Release Application
        run: scripts/build_app.sh
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build-products
          path: DerivedData/Build/Products/Release/
          retention-days: 7

  release:
    name: Release Stage (Notarize, Appcast & GitHub Release)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build-products
          path: DerivedData/Build/Products/Release/
      - name: Package & Notarize Release
        run: scripts/package_and_notarize_release.sh
      - name: Upload Symbols to AppCenter
        run: scripts/upload_symbols_to_appcenter.sh
      - name: Update Sparkle Appcast
        run: scripts/update_appcast.sh
      - id: set_release_info
        name: Extract Latest Changelog
        run: scripts/extract_latest_changelog.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.set_release_info.outputs.body }}
          files: ${{ env.XCODE_BUILD_PATH }}/*.zip
      - name: Dispatch Website Update
        run: scripts/update_website.sh
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
